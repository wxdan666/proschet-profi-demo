# Обратный прокси nginx перед «ПросчётПрофи».
# Установка:
#   sudo cp deploy/nginx-proschet.conf /etc/nginx/sites-available/proschet
#   sudo ln -s /etc/nginx/sites-available/proschet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name proschet.local;

    # Только локальная сеть офиса.
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    client_max_body_size 25m;          # загрузка выгрузок Excel

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit держит с браузером WebSocket-соединение:
        # без этих заголовков страница зависает на «Connecting».
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
